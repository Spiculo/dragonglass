name: Release

# Cut a release by pushing a tag, e.g. `git tag v0.0.1 && git push origin v0.0.1`.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config cmake clang libclang-dev libssl-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-dev \
            libx11-xcb-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libvulkan-dev libfontconfig1-dev libfreetype-dev \
            libasound2-dev

      - name: Windows SDK shader compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $fxc = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter fxc.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match '\\x64\\fxc\.exe$' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $fxc) { throw "fxc.exe was not found in the Windows SDK" }
          $fxc.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Build
        run: cargo build --release -p dragonglass-ui -p dragonglass-cli

      - name: Version
        id: version
        shell: bash
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          chmod +x packaging/linux/build-deb.sh
          packaging/linux/build-deb.sh target/release/dragon-glass \
            "${{ steps.version.outputs.value }}" dist
          tar -czf "dist/dragon-glass-${{ steps.version.outputs.value }}-linux-x86_64.tar.gz" \
            -C target/release dragon-glass dragon-glass-app

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install innosetup --no-progress -y
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging\windows\dragon-glass.iss

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dragon-glass-${{ matrix.os }}
          path: |
            dist/*.deb
            dist/*.tar.gz
            dist/*-setup.exe
          if-no-files-found: error

  macos:
    name: package (macos)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release -p dragonglass-ui -p dragonglass-cli

      - name: Version
        id: version
        shell: bash
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Package
        env:
          # Optional: unset secrets produce an unsigned app, which is still runnable.
          CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          chmod +x packaging/macos/build-app.sh
          packaging/macos/build-app.sh "${{ steps.version.outputs.value }}" dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dragon-glass-macos
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error

  publish:
    name: publish release
    needs: [build, macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download packaged artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Create the GitHub release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            dist/*.deb
            dist/*.tar.gz
            dist/*-setup.exe
            dist/*.dmg
            dist/*.zip
