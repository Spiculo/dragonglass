name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to the same branch cancels the previous run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  core:
    name: core + cli (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features
      - name: Test
        run: cargo test

  ffi:
    name: mobile ffi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test mobile bindings
        run: cargo test -p dragonglass-ffi

  # Produces a runnable (unsigned) .app/DMG on every push. This is the macOS artefact
  # users can download from CI while signing/notarization is being set up.
  macos-bundle:
    name: macos app bundle
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Package
        run: |
          chmod +x packaging/macos/build-universal.sh packaging/macos/build-app.sh
          packaging/macos/build-universal.sh 0.0.0 "$RUNNER_TEMP/dist"
          test -d "$RUNNER_TEMP/dist/DragonGlass.app"
          test -f "$RUNNER_TEMP/dist/DragonGlass-0.0.0-macos.dmg"
      - name: Launch smoke test
        # GitHub's macOS runners can launch GUI apps, but this can be flaky in a headless
        # session; the artifact is still uploaded if the check fails.
        continue-on-error: true
        run: |
          mkdir -p "$RUNNER_TEMP/smoke-vault"
          printf '# Smoke\n\nHello from macOS.\n' > "$RUNNER_TEMP/smoke-vault/Note.md"
          open -n "$RUNNER_TEMP/dist/DragonGlass.app" --args "$RUNNER_TEMP/smoke-vault"
          sleep 8
          if pgrep -f "DragonGlass.app/Contents/MacOS/dragon-glass-app" >/dev/null; then
            echo "Dragon Glass launched and stayed alive for 8 seconds"
            pkill -f "DragonGlass.app/Contents/MacOS/dragon-glass-app" || true
          else
            echo "Dragon Glass exited before the smoke-test window"
            exit 1
          fi

      - name: Upload app bundle
        uses: actions/upload-artifact@v7
        with:
          name: dragon-glass-macos-ci
          path: |
            ${{ runner.temp }}/dist/*.dmg
            ${{ runner.temp }}/dist/*.zip
          if-no-files-found: error

  # GPUI needs a GPU/display stack and a long build, so this is a separate job.
  ui:
    name: ui build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # macos-latest is Apple Silicon (arm64); add macos-13 for Intel artefacts later.
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config cmake clang libclang-dev libssl-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-dev \
            libx11-xcb-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libvulkan-dev libfontconfig1-dev libfreetype-dev \
            libasound2-dev
      - name: Windows SDK shader compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $fxc = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter fxc.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match '\\x64\\fxc\.exe$' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $fxc) { throw "fxc.exe was not found in the Windows SDK" }
          $fxc.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Append
      - run: cargo build -p dragonglass-ui
