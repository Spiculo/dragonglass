[package]
name = "dragonglass-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Headless engine for Dragon Glass: vault, parsing, index, link graph."

[dependencies]
walkdir.workspace = true
thiserror.workspace = true
ropey.workspace = true
regex = "1"
serde_json = "1"

# Math typesetting: KaTeX-compatible parsing/layout producing a platform-neutral
# display list. Pinned exactly because the 0.1.x line moves quickly; the wrapper in
# `src/math/` is the only place that talks to these crates.
ratex-types = "=0.1.15"
ratex-parser = "=0.1.15"
ratex-layout = "=0.1.15"
ratex-font = "=0.1.15"
ratex-font-loader = { version = "=0.1.15", features = ["embed-fonts"] }
ratex-katex-fonts = "=0.1.15"
ratex-svg = { version = "=0.1.15", features = ["embed-fonts"] }
ab_glyph = "0.2"

[dev-dependencies]
# Used by the SVG golden test: integration tests do not inherit the library's deps.
ratex-svg = { version = "=0.1.15", features = ["embed-fonts"] }
# Used by the KaTeX reference-image test.
ratex-render = { version = "=0.1.15", features = ["embed-fonts"] }
png = "0.17"
