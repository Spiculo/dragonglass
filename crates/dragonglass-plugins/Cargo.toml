[package]
name = "dragonglass-plugins"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "WASM plugin runtime for Dragon Glass."

[dependencies]
dragonglass-core.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
# Trimmed feature set: no async, no component model, no threads.
wasmtime = { version = "49", default-features = false, features = [
    "runtime",
    "cranelift",
    "std",
    "wat",
] }
