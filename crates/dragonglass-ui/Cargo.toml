[package]
name = "dragonglass-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Native GPUI application for Dragon Glass."

[[bin]]
name = "dragon-glass-app"
path = "src/main.rs"

[dependencies]
dragonglass-core.workspace = true
dragonglass-plugins.workspace = true
anyhow.workspace = true
chrono = "0.4"
gpui = "0.2.2"
image = { version = "0.25.1", default-features = false, features = [
    "bmp",
    "gif",
    "jpeg",
    "png",
    "webp",
] }
notify = "8.2"
smallvec = "1"
smol = "2"

# macOS: compile the Metal shaders at startup instead of at build time. The build-time
# path calls `xcrun metal`, which ships with a full Xcode install but not with the
# Command Line Tools, so a plain CLT machine could not build the app. The shaders are
# small; the extra work happens once per launch.
[target.'cfg(target_os = "macos")'.dependencies]
gpui = { version = "0.2.2", features = ["runtime_shaders"] }

# The Windows resource compiler is only needed for the icon/VERSIONINFO block.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
